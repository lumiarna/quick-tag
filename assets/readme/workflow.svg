<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">How Quick Tag moves a tag from settings to frontmatter</title>
  <desc id="desc">Three-step workflow: define slash-separated preset tags, click a sidebar chip, then Quick Tag updates YAML frontmatter and recent-tag context.</desc>

  <rect width="1200" height="340" rx="24" fill="#F5F2F8"/>
  <text x="54" y="49" fill="#4C4557" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">A SHORT, VISIBLE LOOP</text>
  <path d="M54 70H1146" stroke="#DAD4E1"/>

  <path d="M356 174H421M413 166L421 174L413 182" fill="none" stroke="#7555C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M777 174H842M834 166L842 174L834 182" fill="none" stroke="#7555C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(54 96)">
    <text fill="#7555C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">01 / DEFINE</text>
    <text y="34" fill="#28232F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Write one preset per line</text>
    <rect y="54" width="302" height="98" rx="12" fill="#E9E4EE" stroke="#D3CCDB"/>
    <text x="17" y="82" fill="#716979" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">project/frontend/ui</text>
    <text x="17" y="106" fill="#716979" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">writing/draft</text>
    <text x="17" y="130" fill="#716979" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">idea</text>
  </g>

  <g transform="translate(445 96)">
    <text fill="#7555C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">02 / TOGGLE</text>
    <text y="34" fill="#28232F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Click the sidebar chip</text>
    <rect y="54" width="302" height="98" rx="12" fill="#25212B"/>
    <rect x="18" y="70" width="266" height="29" rx="7" fill="#332E3A" stroke="#514A5A"/>
    <text x="31" y="89" fill="#D9D3E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="650">▸ project</text>
    <rect x="18" y="109" width="74" height="28" rx="7" fill="#332E3A"/>
    <text x="55" y="128" text-anchor="middle" fill="#C4BDCC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">frontend</text>
    <rect x="101" y="109" width="39" height="28" rx="7" fill="#A78BFA"/>
    <text x="120.5" y="128" text-anchor="middle" fill="#201C26" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">ui</text>
  </g>

  <g transform="translate(866 96)">
    <text fill="#7555C7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">03 / WRITE</text>
    <text y="34" fill="#28232F" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">Keep the note in sync</text>
    <rect y="54" width="280" height="98" rx="12" fill="#E9E4EE" stroke="#D3CCDB"/>
    <text x="17" y="82" fill="#655D6D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">frontmatter</text>
    <text x="17" y="108" fill="#39333F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">tags:</text>
    <text x="17" y="132" fill="#39333F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">  - project/frontend/ui</text>
    <circle cx="256" cy="26" r="5" fill="#58B993"/>
  </g>

  <g transform="translate(54 295)">
    <circle cx="5" cy="-5" r="5" fill="#58B993"/>
    <text x="19" fill="#686071" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Metadata changes refresh active states and recent tags; presets and their parent paths stay out of Recent.</text>
  </g>
</svg>
